<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@900&amp;display=swap');
      .avatar-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 440px;
        letter-spacing: -20px;
        fill: #202020;
      }
    </style>
  </defs>
  
  <!-- Canvas: Warm Cream (#F6F3ED) -->
  <rect width="1080" height="1080" fill="#F6F3ED" />
  
  <!-- Centered Content Group -->
  <g transform="translate(540, 540)">
    <!-- Monogram gb -->
    <text x="-40" y="145" class="avatar-text" text-anchor="middle">gb</text>
    
    <!-- Master System Dot (1.03 Optical Vertical Stretch, Action Coral #FF4D3D) -->
    <ellipse cx="235" cy="-80" rx="35" ry="36.05" fill="#FF4D3D" />
  </g>
</svg>
