<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDECE8"/>
      <stop offset="100%" stop-color="#E5E4DE"/>
    </linearGradient>
    <linearGradient id="tableBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE4"/>
      <stop offset="50%" stop-color="#F3E9DC"/>
      <stop offset="100%" stop-color="#EADBCA"/>
    </linearGradient>
    <filter id="studioShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#4A3E30" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4A3E30" flood-opacity="0.08"/>
    </filter>
    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#30261A" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="charcoalTwill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C3D40"/>
      <stop offset="40%" stop-color="#262729"/>
      <stop offset="100%" stop-color="#181819"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2B2D"/>
      <stop offset="100%" stop-color="#141415"/>
    </linearGradient>
  </defs>

  
  <!-- Studio Wall (Top) -->
  <rect width="1000" height="480" fill="url(#wallBg)"/>
  
  <!-- Subtle Wall Soft Light -->
  <circle cx="450" cy="192" r="500" fill="#FFFFFF" opacity="0.4" filter="blur(60px)"/>

  <!-- Studio Table Surface (Bottom) -->
  <rect y="480" width="1000" height="520" fill="url(#tableBg)"/>

  <!-- Horizon Shadow Line -->
  <line x1="0" y1="480" x2="1000" y2="480" stroke="#DFD7CA" stroke-width="1.5"/>
    

  <!-- Contact Shadows on Table -->
  <ellipse cx="500" cy="740" rx="300" ry="46" fill="#3D3224" opacity="0.16" filter="blur(20px)"/>
  <ellipse cx="500" cy="735" rx="220" ry="24" fill="#2C2014" opacity="0.24" filter="blur(8px)"/>

  <g filter="url(#studioShadow)">
    <!-- CURVED VISOR (PEAK) -->
    <path d="M240,600 C250,740 750,740 760,600 C700,685 300,685 240,600 Z" fill="url(#visorGrad)"/>
    <!-- Visor Stitching Lines -->
    <path d="M280,625 C330,695 670,695 720,625" fill="none" stroke="#48494C" stroke-width="2.5" stroke-dasharray="7,5"/>
    <path d="M295,640 C345,705 655,705 705,640" fill="none" stroke="#48494C" stroke-width="2.5" stroke-dasharray="7,5"/>
    <path d="M310,655 C360,715 640,715 690,655" fill="none" stroke="#48494C" stroke-width="2.5" stroke-dasharray="7,5"/>

    <!-- MAIN 6-PANEL CROWN DOME -->
    <path d="M270,600 C255,340 370,220 500,215 C630,220 745,340 730,600 C650,625 350,625 270,600 Z" fill="url(#charcoalTwill)"/>
    
    <!-- Panel Seam Stitching -->
    <path d="M500,215 L500,605" stroke="#161617" stroke-width="3"/>
    <path d="M500,215 L500,605" stroke="#525357" stroke-width="1.5" stroke-dasharray="5,4"/>
    
    <path d="M500,215 Q390,380 320,595" stroke="#161617" stroke-width="2.5"/>
    <path d="M500,215 Q610,380 680,595" stroke="#161617" stroke-width="2.5"/>

    <!-- Ventilation Eyelets -->
    <circle cx="410" cy="340" r="7" fill="#161617" stroke="#505155" stroke-width="2.5"/>
    <circle cx="590" cy="340" r="7" fill="#161617" stroke="#505155" stroke-width="2.5"/>

    <!-- Top Squatchee Button -->
    <ellipse cx="500" cy="215" rx="18" ry="12" fill="#1C1C1D" stroke="#3A3B3E" stroke-width="2"/>

    <!-- 3D LOGO EMBROIDERY (Front Crown) -->
    <g transform="translate(500, 465)">
      <!-- Drop shadow of embroidery -->
      <text x="-12" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="42" fill="#0A0A0A" letter-spacing="-1.2" text-anchor="middle">gezenbiri</text>
      <!-- Main Oyster White Thread -->
      <text x="-12" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="42" fill="#EDE9DF" letter-spacing="-1.2" text-anchor="middle">gezenbiri</text>
      <!-- Action Coral 3D Embroidered Dot -->
      <ellipse cx="84" cy="-8" rx="6.3" ry="6.5" fill="#FF4D3D" stroke="#CC3022" stroke-width="1.5"/>
    </g>
  </g>
</svg>