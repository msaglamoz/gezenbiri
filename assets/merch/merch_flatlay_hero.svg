<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="flatlayBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE4"/>
      <stop offset="50%" stop-color="#F2E8DA"/>
      <stop offset="100%" stop-color="#E5D9C7"/>
    </linearGradient>
    <filter id="flatlayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#3D3224" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#flatlayBg)"/>

  <!-- Subtle Studio Overhead Spotlight -->
  <circle cx="600" cy="300" r="450" fill="#FFFFFF" opacity="0.35" filter="blur(60px)"/>

  <!-- 1. TOTE BAG (Left) -->
  <g transform="translate(180, 310) rotate(-8) scale(0.65)" filter="url(#flatlayShadow)">
    <rect x="-140" y="-170" width="280" height="340" rx="8" fill="#FAF7F0" stroke="#E2DAC7" stroke-width="2"/>
    <text x="0" y="-10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#282828" text-anchor="middle">Bir yere</text>
    <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#282828" text-anchor="middle">gidelim.</text>
  </g>

  <!-- 2. WHITE ENAMEL MUG (Center Left) -->
  <g transform="translate(470, 320) scale(0.7)" filter="url(#flatlayShadow)">
    <circle cx="0" cy="0" r="90" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="84" fill="#FAF8F3" stroke="#252525" stroke-width="7"/>
    <text x="-8" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="26" fill="#262626" text-anchor="middle">gezenbiri</text>
    <ellipse cx="50" cy="4" rx="3.9" ry="4.0" fill="#FF4D3D"/>
  </g>

  <!-- 3. ACTION CORAL NOTEBOOK (Center Right) -->
  <g transform="translate(720, 300) rotate(6) scale(0.65)" filter="url(#flatlayShadow)">
    <rect x="-110" y="-160" width="220" height="320" rx="12" fill="#FF4D3D"/>
    <rect x="65" y="-160" width="14" height="320" fill="#202020" opacity="0.92"/>
    <text x="-10" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="26" fill="#8F1B10" text-anchor="middle">gezenbiri</text>
    <ellipse cx="48" cy="4" rx="3.8" ry="3.9" fill="#8F1B10"/>
  </g>

  <!-- 4. VINTAGE CHARCOAL CAP (Far Right) -->
  <g transform="translate(980, 290) rotate(12) scale(0.6)" filter="url(#flatlayShadow)">
    <circle cx="0" cy="0" r="110" fill="#262729"/>
    <path d="M-90,40 C-30,120 70,120 110,40" fill="#141415"/>
    <text x="-8" y="-10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#EDE9DF" text-anchor="middle">gezenbiri</text>
    <ellipse cx="46" cy="-16" rx="3.8" ry="3.9" fill="#FF4D3D"/>
  </g>

  <!-- HERO TITLE & OVERLAY -->
  <g transform="translate(600, 80)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FF4D3D" letter-spacing="3" text-transform="uppercase" text-anchor="middle">gezenbiri · FİZİKSEL MARKA KOLEKSİYONU</text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#202020" letter-spacing="-0.8" text-anchor="middle">Stüdyo Kalitesinde Özgün Üretim Standartları</text>
  </g>
</svg>