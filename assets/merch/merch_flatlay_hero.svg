<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282828"/>
      <stop offset="50%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#heroCanvas)"/>

  <!-- Subtle Studio Spotlight -->
  <circle cx="600" cy="300" r="450" fill="#FF4D3D" opacity="0.04" filter="blur(80px)"/>

  <!-- 1. TOTE BAG (Left) -->
  <g transform="translate(180, 310) rotate(-8) scale(0.65)" filter="url(#heroShadow)">
    <rect x="-140" y="-170" width="280" height="340" rx="8" fill="#EDE7DA"/>
    <text x="0" y="-10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#202020" text-anchor="middle">Bir yere</text>
    <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#202020" text-anchor="middle">gidelim.</text>
  </g>

  <!-- 2. ENAMEL MUG (Center Left) -->
  <g transform="translate(470, 320) scale(0.7)" filter="url(#heroShadow)">
    <circle cx="0" cy="0" r="85" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="80" fill="#F4EFE6" stroke="#202020" stroke-width="6"/>
    <text x="-6" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#202020" text-anchor="middle">gezenbiri</text>
    <ellipse cx="48" cy="2" rx="3.6" ry="3.7" fill="#FF4D3D"/>
  </g>

  <!-- 3. TRAVEL NOTEBOOK (Center Right) -->
  <g transform="translate(720, 300) rotate(6) scale(0.65)" filter="url(#heroShadow)">
    <rect x="-110" y="-160" width="220" height="320" rx="10" fill="#FF4D3D"/>
    <rect x="65" y="-160" width="14" height="320" fill="#202020" opacity="0.9"/>
    <text x="-10" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="26" fill="#8F1B10" text-anchor="middle">gezenbiri</text>
    <ellipse cx="48" cy="4" rx="3.8" ry="3.9" fill="#8F1B10"/>
  </g>

  <!-- 4. VINTAGE CAP (Far Right) -->
  <g transform="translate(980, 290) rotate(12) scale(0.6)" filter="url(#heroShadow)">
    <circle cx="0" cy="0" r="110" fill="#2A2A2A"/>
    <path d="M-90,40 C-30,120 70,120 110,40" fill="#1E1E1E"/>
    <text x="-6" y="-10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#EAE5D8" text-anchor="middle">gezenbiri</text>
    <ellipse cx="48" cy="-16" rx="3.8" ry="3.9" fill="#FF4D3D"/>
  </g>

  <!-- HERO TITLE OVERLAY (Top Center) -->
  <g transform="translate(600, 100)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FF4D3D" letter-spacing="3" text-transform="uppercase" text-anchor="middle">gezenbiri · FİZİKSEL MARKA KOLEKSİYONU</text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="-0.8" text-anchor="middle">Ödünsüz Malzeme &amp; Kusursuz Marka Kimliği</text>
  </g>
</svg>