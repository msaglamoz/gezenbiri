<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDECE8"/>
      <stop offset="100%" stop-color="#E5E4DE"/>
    </linearGradient>
    <linearGradient id="tableBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE4"/>
      <stop offset="50%" stop-color="#F3E9DC"/>
      <stop offset="100%" stop-color="#EADBCA"/>
    </linearGradient>
    <filter id="studioShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#4A3E30" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4A3E30" flood-opacity="0.08"/>
    </filter>
    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#30261A" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="mugBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2DFD8"/>
      <stop offset="22%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#D0C9BD"/>
    </linearGradient>
    <linearGradient id="blackRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#383838"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAE6DC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C5BEB0"/>
    </linearGradient>
  </defs>

  
  <!-- Studio Wall (Top) -->
  <rect width="1000" height="480" fill="url(#wallBg)"/>
  
  <!-- Subtle Wall Soft Light -->
  <circle cx="450" cy="192" r="500" fill="#FFFFFF" opacity="0.4" filter="blur(60px)"/>

  <!-- Studio Table Surface (Bottom) -->
  <rect y="480" width="1000" height="520" fill="url(#tableBg)"/>

  <!-- Horizon Shadow Line -->
  <line x1="0" y1="480" x2="1000" y2="480" stroke="#DFD7CA" stroke-width="1.5"/>
    

  <!-- Contact Shadows on Table -->
  <ellipse cx="490" cy="760" rx="240" ry="34" fill="#3D3224" opacity="0.16" filter="blur(18px)"/>
  <ellipse cx="490" cy="755" rx="180" ry="18" fill="#2C2014" opacity="0.22" filter="blur(6px)"/>

  <!-- HANDLE -->
  <g filter="url(#studioShadow)">
    <path d="M600,410 C740,410 760,620 600,635" fill="none" stroke="url(#handleGrad)" stroke-width="44" stroke-linecap="round"/>
    <path d="M600,410 C740,410 760,620 600,635" fill="none" stroke="#202020" stroke-width="2" opacity="0.1"/>
  </g>

  <!-- MUG BODY -->
  <g filter="url(#studioShadow)">
    <!-- Main Cylinder -->
    <path d="M280,310 L700,310 L675,720 C672,745 650,760 620,760 L360,760 C330,760 308,745 305,720 Z" fill="url(#mugBody)"/>
    
    <!-- Glossy Glaze Reflection Highlight -->
    <path d="M340,340 L370,340 L355,730 L330,720 Z" fill="#FFFFFF" opacity="0.65" filter="blur(3px)"/>

    <!-- Bottom Rim Curve -->
    <ellipse cx="490" cy="745" rx="140" ry="14" fill="#B5ADA0" opacity="0.35"/>

    <!-- ENAMEL BLACK TOP RIM (Rolled Edge) -->
    <ellipse cx="490" cy="310" rx="212" ry="28" fill="url(#blackRim)"/>
    <ellipse cx="490" cy="310" rx="204" ry="22" fill="#FAF8F3"/>
    <ellipse cx="490" cy="310" rx="196" ry="19" fill="#252525" opacity="0.9"/>

    <!-- CENTER BRAND LOGO PRINT -->
    <g transform="translate(485, 540)">
      <!-- Main Wordmark -->
      <text x="-12" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="52" fill="#262626" letter-spacing="-1.8" text-anchor="middle">gezenbiri</text>
      <!-- Action Coral System Dot (%3 vertical stretch: rx=7.8, ry=8.03) -->
      <ellipse cx="102" cy="-9" rx="7.8" ry="8.03" fill="#FF4D3D"/>
    </g>
  </g>
</svg>