<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDECE8"/>
      <stop offset="100%" stop-color="#E5E4DE"/>
    </linearGradient>
    <linearGradient id="tableBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE4"/>
      <stop offset="50%" stop-color="#F3E9DC"/>
      <stop offset="100%" stop-color="#EADBCA"/>
    </linearGradient>
    <filter id="studioShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#4A3E30" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4A3E30" flood-opacity="0.08"/>
    </filter>
    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#30261A" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="coralCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C4D"/>
      <stop offset="40%" stop-color="#FF4D3D"/>
      <stop offset="100%" stop-color="#E03728"/>
    </linearGradient>
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B82417"/>
      <stop offset="100%" stop-color="#FF4D3D"/>
    </linearGradient>
  </defs>

  
  <!-- Studio Wall (Top) -->
  <rect width="1000" height="480" fill="url(#wallBg)"/>
  
  <!-- Subtle Wall Soft Light -->
  <circle cx="450" cy="192" r="500" fill="#FFFFFF" opacity="0.4" filter="blur(60px)"/>

  <!-- Studio Table Surface (Bottom) -->
  <rect y="480" width="1000" height="520" fill="url(#tableBg)"/>

  <!-- Horizon Shadow Line -->
  <line x1="0" y1="480" x2="1000" y2="480" stroke="#DFD7CA" stroke-width="1.5"/>
    

  <!-- Contact Shadows on Table -->
  <ellipse cx="500" cy="780" rx="260" ry="32" fill="#3D3224" opacity="0.16" filter="blur(20px)"/>
  <ellipse cx="500" cy="775" rx="200" ry="16" fill="#2C2014" opacity="0.22" filter="blur(6px)"/>

  <!-- NOTEBOOK BODY -->
  <g filter="url(#studioShadow)" transform="translate(290, 180)">
    <!-- Page Block Thickness (Right edge) -->
    <path d="M20,25 L405,25 C414,25 420,30 420,38 L420,582 C420,590 414,595 405,595 L20,595 Z" fill="#F4EFE6"/>
    <line x1="418" y1="30" x2="418" y2="590" stroke="#E0D7C5" stroke-width="2.5"/>
    <line x1="412" y1="30" x2="412" y2="590" stroke="#E0D7C5" stroke-width="2.5"/>

    <!-- Coral Leather Hardcover -->
    <rect x="0" y="15" width="410" height="580" rx="16" fill="url(#coralCover)"/>
    
    <!-- Spine Crease Shadow -->
    <rect x="0" y="15" width="28" height="580" rx="6" fill="url(#spineShadow)" opacity="0.75"/>
    <line x1="28" y1="15" x2="28" y2="595" stroke="#B82417" stroke-width="2"/>

    <!-- Black Ribbon Bookmark -->
    <path d="M230,595 L230,670 L244,650 L258,670 L258,595 Z" fill="#202020"/>

    <!-- Black Elastic Closure Strap -->
    <rect x="330" y="15" width="22" height="580" rx="3" fill="#202020" opacity="0.94"/>
    <rect x="330" y="15" width="3" height="580" fill="#444" opacity="0.5"/>

    <!-- DEBOSSED LOGO (Center) -->
    <g transform="translate(195, 300)">
      <!-- Deboss inner shadow -->
      <text x="-8" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="40" fill="#8F1B10" letter-spacing="-1.5" text-anchor="middle">gezenbiri</text>
      <!-- Deboss highlight -->
      <text x="-8" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="40" fill="#B5271A" letter-spacing="-1.5" text-anchor="middle">gezenbiri</text>
      <!-- Debossed dot -->
      <ellipse cx="80" cy="-7" rx="6.0" ry="6.2" fill="#8F1B10"/>

      <text x="0" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#B5271A" letter-spacing="2.5" text-anchor="middle">192 SAYFA · 100 G/M² FİLDİŞİ</text>
    </g>
  </g>
</svg>