<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE8DD"/>
      <stop offset="100%" stop-color="#DCD4C4"/>
    </linearGradient>
    <linearGradient id="coralCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C4D"/>
      <stop offset="40%" stop-color="#FF4D3D"/>
      <stop offset="100%" stop-color="#E03728"/>
    </linearGradient>
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BA2618"/>
      <stop offset="100%" stop-color="#FF4D3D"/>
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="22" stdDeviation="26" flood-color="#202020" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Desk -->
  <rect width="800" height="600" fill="url(#deskBg)"/>

  <!-- NOTEBOOK BODY -->
  <g filter="url(#bookShadow)" transform="translate(250, 80)">
    <!-- Page Block Thickness -->
    <path d="M15,20 L315,20 C322,20 326,24 326,30 L326,450 C326,456 322,460 315,460 L15,460 Z" fill="#F4EFE6"/>
    <line x1="324" y1="25" x2="324" y2="455" stroke="#E2DAC8" stroke-width="2"/>
    <line x1="320" y1="25" x2="320" y2="455" stroke="#E2DAC8" stroke-width="2"/>

    <!-- Coral Leather Cover -->
    <rect x="0" y="10" width="318" height="450" rx="12" fill="url(#coralCover)"/>
    
    <!-- Spine Crease Shadow -->
    <rect x="0" y="10" width="22" height="450" rx="4" fill="url(#spineShadow)" opacity="0.75"/>
    <line x1="22" y1="10" x2="22" y2="460" stroke="#B82417" stroke-width="1.5"/>

    <!-- Black Ribbon Bookmark Hanging Out -->
    <path d="M180,450 L180,510 L190,495 L200,510 L200,450 Z" fill="#202020"/>

    <!-- Black Elastic Closure Band -->
    <rect x="255" y="10" width="16" height="450" rx="2" fill="#202020" opacity="0.92"/>
    <rect x="255" y="10" width="2" height="450" fill="#444" opacity="0.5"/>

    <!-- DEBOSSED (KÖR GOFRE) LOGO CENTERPIECE -->
    <g transform="translate(150, 230)">
      <!-- Deboss inner shadow -->
      <text x="-6" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#8F1B10" letter-spacing="-1" text-anchor="middle">gezenbiri</text>
      <!-- Deboss highlight -->
      <text x="-6" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#B5271A" letter-spacing="-1" text-anchor="middle">gezenbiri</text>
      <!-- Debossed dot -->
      <ellipse cx="58" cy="-5" rx="4.2" ry="4.35" fill="#8F1B10"/>

      <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8.5" fill="#B5271A" letter-spacing="2" text-anchor="middle">192 SAYFA · 100 G/M² FİLDİŞİ</text>
    </g>
  </g>

  <!-- Technical Spec Tag Floating Pill -->
  <g transform="translate(40, 520)">
    <rect width="230" height="46" rx="10" fill="#FFFFFF" filter="url(#bookShadow)"/>
    <text x="16" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#202020">SEYAHAT NOT DEFTERİ</text>
    <text x="16" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#FF4D3D">Coral Cilt · Kör Gofre (Emboss)</text>
  </g>
</svg>