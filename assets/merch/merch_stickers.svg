<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="slateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE5DB"/>
      <stop offset="100%" stop-color="#DDD5C6"/>
    </linearGradient>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="14" stdDeviation="16" flood-color="#202020" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#slateBg)"/>

  <!-- STICKER 1: CHARCOAL CIRCLE gb. (Left) -->
  <g filter="url(#stickerShadow)" transform="translate(240, 280) rotate(-6)">
    <!-- White Die-Cut Peel Border -->
    <circle cx="0" cy="0" r="95" fill="#FFFFFF"/>
    <!-- Main Matte Vinyl Charcoal Body -->
    <circle cx="0" cy="0" r="90" fill="#202020"/>
    
    <!-- Monogram gb. -->
    <text x="-8" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="#F6F3ED" letter-spacing="-2" text-anchor="middle">gb</text>
    <ellipse cx="32" cy="-6" rx="7.8" ry="8.0" fill="#FF4D3D"/>

    <!-- Circular Subtext Arch -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" fill="#888888" letter-spacing="3" text-anchor="middle">AUTHENTIC ESCAPES</text>
  </g>

  <!-- STICKER 2: WARM CREAM SLOGAN SEAL (Right) -->
  <g filter="url(#stickerShadow)" transform="translate(520, 270) rotate(8)">
    <!-- White Die-Cut Peel Border -->
    <circle cx="0" cy="0" r="105" fill="#FFFFFF"/>
    <!-- Cream Matte Vinyl Body -->
    <circle cx="0" cy="0" r="100" fill="#F6F3ED" stroke="#202020" stroke-width="2"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#202020" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Slogan Text -->
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#202020" letter-spacing="-0.8" text-anchor="middle">BİR YERE</text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#202020" letter-spacing="-0.8" text-anchor="middle">GİDELİM.</text>

    <!-- Star & Year -->
    <ellipse cx="0" cy="45" rx="3.5" ry="3.6" fill="#FF4D3D"/>
    <text x="0" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#777" letter-spacing="2.5" text-anchor="middle">EST. 2026</text>
  </g>

  <!-- STICKER 3: ACTION CORAL RECTANGULAR BADGE (Bottom Center Overlap) -->
  <g filter="url(#stickerShadow)" transform="translate(380, 410) rotate(-2)">
    <rect x="-115" y="-35" width="230" height="70" rx="14" fill="#FFFFFF"/>
    <rect x="-110" y="-30" width="220" height="60" rx="10" fill="#FF4D3D"/>
    <text x="-8" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="-0.8" text-anchor="middle">gezenbiri</text>
    <ellipse cx="50" cy="2" rx="3.6" ry="3.7" fill="#FFFFFF"/>
  </g>

  <!-- Technical Spec Tag Floating Pill -->
  <g transform="translate(40, 520)">
    <rect width="230" height="46" rx="10" fill="#FFFFFF" filter="url(#stickerShadow)"/>
    <text x="16" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#202020">MAT VİNİL MÜHÜR PAKETİ</text>
    <text x="16" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#FF4D3D">90µ UV &amp; Su Dayanıklı Vinil</text>
  </g>
</svg>