<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDECE8"/>
      <stop offset="100%" stop-color="#E5E4DE"/>
    </linearGradient>
    <linearGradient id="tableBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE4"/>
      <stop offset="50%" stop-color="#F3E9DC"/>
      <stop offset="100%" stop-color="#EADBCA"/>
    </linearGradient>
    <filter id="studioShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#4A3E30" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4A3E30" flood-opacity="0.08"/>
    </filter>
    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#30261A" flood-opacity="0.25"/>
    </filter>

  </defs>

  
  <!-- Studio Wall (Top) -->
  <rect width="1000" height="480" fill="url(#wallBg)"/>
  
  <!-- Subtle Wall Soft Light -->
  <circle cx="450" cy="192" r="500" fill="#FFFFFF" opacity="0.4" filter="blur(60px)"/>

  <!-- Studio Table Surface (Bottom) -->
  <rect y="480" width="1000" height="520" fill="url(#tableBg)"/>

  <!-- Horizon Shadow Line -->
  <line x1="0" y1="480" x2="1000" y2="480" stroke="#DFD7CA" stroke-width="1.5"/>
    

  <!-- Contact Shadows on Table -->
  <ellipse cx="500" cy="720" rx="320" ry="40" fill="#3D3224" opacity="0.15" filter="blur(22px)"/>

  <!-- STICKER 1: CHARCOAL CIRCLE gb. (Left) -->
  <g filter="url(#studioShadow)" transform="translate(320, 450) rotate(-6)">
    <circle cx="0" cy="0" r="130" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="122" fill="#202020"/>
    
    <text x="-12" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="70" fill="#F6F3ED" letter-spacing="-2.5" text-anchor="middle">gb</text>
    <ellipse cx="44" cy="-8" rx="10.5" ry="10.8" fill="#FF4D3D"/>

    <text x="0" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.5" fill="#888888" letter-spacing="4" text-anchor="middle">AUTHENTIC ESCAPES</text>
  </g>

  <!-- STICKER 2: WARM CREAM SLOGAN SEAL (Right) -->
  <g filter="url(#studioShadow)" transform="translate(680, 430) rotate(8)">
    <circle cx="0" cy="0" r="140" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="132" fill="#F6F3ED" stroke="#202020" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="122" fill="none" stroke="#202020" stroke-width="1.5" stroke-dasharray="5,4"/>

    <text x="0" y="-16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#202020" letter-spacing="-1" text-anchor="middle">BİR YERE</text>
    <text x="0" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#202020" letter-spacing="-1" text-anchor="middle">GİDELİM.</text>

    <ellipse cx="0" cy="60" rx="4.5" ry="4.65" fill="#FF4D3D"/>
    <text x="0" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#777" letter-spacing="3" text-anchor="middle">EST. 2026</text>
  </g>

  <!-- STICKER 3: ACTION CORAL BADGE (Center Overlap) -->
  <g filter="url(#studioShadow)" transform="translate(500, 620) rotate(-2)">
    <rect x="-155" y="-48" width="310" height="96" rx="18" fill="#FFFFFF"/>
    <rect x="-148" y="-42" width="296" height="84" rx="14" fill="#FF4D3D"/>
    <text x="-12" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="-1" text-anchor="middle">gezenbiri</text>
    <ellipse cx="68" cy="4" rx="4.8" ry="4.95" fill="#FFFFFF"/>
  </g>
</svg>