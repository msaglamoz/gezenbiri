<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDECE8"/>
      <stop offset="100%" stop-color="#E5E4DE"/>
    </linearGradient>
    <linearGradient id="tableBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE4"/>
      <stop offset="50%" stop-color="#F3E9DC"/>
      <stop offset="100%" stop-color="#EADBCA"/>
    </linearGradient>
    <filter id="studioShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#4A3E30" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4A3E30" flood-opacity="0.08"/>
    </filter>
    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#30261A" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="saddleLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C58045"/>
      <stop offset="40%" stop-color="#A56430"/>
      <stop offset="100%" stop-color="#7D4419"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B867"/>
      <stop offset="50%" stop-color="#FFDE8A"/>
      <stop offset="100%" stop-color="#A87F35"/>
    </linearGradient>
  </defs>

  
  <!-- Studio Wall (Top) -->
  <rect width="1000" height="480" fill="url(#wallBg)"/>
  
  <!-- Subtle Wall Soft Light -->
  <circle cx="450" cy="192" r="500" fill="#FFFFFF" opacity="0.4" filter="blur(60px)"/>

  <!-- Studio Table Surface (Bottom) -->
  <rect y="480" width="1000" height="520" fill="url(#tableBg)"/>

  <!-- Horizon Shadow Line -->
  <line x1="0" y1="480" x2="1000" y2="480" stroke="#DFD7CA" stroke-width="1.5"/>
    

  <!-- Contact Shadows on Table -->
  <ellipse cx="500" cy="780" rx="220" ry="28" fill="#3D3224" opacity="0.16" filter="blur(18px)"/>
  <ellipse cx="500" cy="775" rx="160" ry="14" fill="#2C2014" opacity="0.22" filter="blur(6px)"/>

  <g filter="url(#studioShadow)" transform="translate(365, 140)">
    <!-- LEATHER HANGING STRAP -->
    <path d="M135,-30 L135,140" stroke="#8A4E20" stroke-width="26" stroke-linecap="round"/>
    <path d="M135,-30 L135,140" stroke="#66340F" stroke-width="2.5" stroke-dasharray="6,4"/>
    
    <!-- BRASS BUCKLE -->
    <rect x="116" y="30" width="38" height="30" rx="6" fill="none" stroke="url(#brassGrad)" stroke-width="7"/>
    <line x1="135" y1="30" x2="135" y2="60" stroke="#684D1C" stroke-width="4"/>

    <!-- MAIN LEATHER TAG BODY -->
    <path d="M40,120 L230,120 C252,120 266,136 262,158 L244,570 C240,586 226,598 210,598 L60,598 C44,598 30,586 26,570 L8,158 C4,136 18,120 40,120 Z" fill="url(#saddleLeather)"/>

    <!-- Artisan Saddle Stitching Perimeter -->
    <path d="M46,132 L224,132 L206,586 L64,586 Z" fill="none" stroke="#E6BF95" stroke-width="2.5" stroke-dasharray="8,5" opacity="0.9"/>

    <!-- Brass Eyelet Hole -->
    <circle cx="135" cy="155" r="14" fill="url(#brassGrad)"/>
    <circle cx="135" cy="155" r="7" fill="#3D200A"/>

    <!-- HOT STAMPED MONOGRAM gb. -->
    <g transform="translate(135, 360)">
      <text x="-6" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="#381804" letter-spacing="-2" text-anchor="middle">gb</text>
      <text x="-6" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="#52270B" letter-spacing="-2" text-anchor="middle">gb</text>
      <!-- Action Coral Debossed Dot -->
      <ellipse cx="44" cy="-10" rx="9.6" ry="9.9" fill="#FF4D3D"/>

      <text x="0" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#52270B" letter-spacing="3" text-anchor="middle">GENUINE LEATHER</text>
    </g>
  </g>
</svg>