<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDECE8"/>
      <stop offset="100%" stop-color="#E5E4DE"/>
    </linearGradient>
    <linearGradient id="tableBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE4"/>
      <stop offset="50%" stop-color="#F3E9DC"/>
      <stop offset="100%" stop-color="#EADBCA"/>
    </linearGradient>
    <filter id="studioShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#4A3E30" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4A3E30" flood-opacity="0.08"/>
    </filter>
    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#30261A" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="toteFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="40%" stop-color="#F2EDE0"/>
      <stop offset="85%" stop-color="#E5DEC8"/>
      <stop offset="100%" stop-color="#DCD4BC"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBE3D0"/>
      <stop offset="100%" stop-color="#D8CFB8"/>
    </linearGradient>
  </defs>

  
  <!-- Studio Wall (Top) -->
  <rect width="1000" height="480" fill="url(#wallBg)"/>
  
  <!-- Subtle Wall Soft Light -->
  <circle cx="450" cy="192" r="500" fill="#FFFFFF" opacity="0.4" filter="blur(60px)"/>

  <!-- Studio Table Surface (Bottom) -->
  <rect y="480" width="1000" height="520" fill="url(#tableBg)"/>

  <!-- Horizon Shadow Line -->
  <line x1="0" y1="480" x2="1000" y2="480" stroke="#DFD7CA" stroke-width="1.5"/>
    

  <!-- Contact Shadows on Table -->
  <ellipse cx="500" cy="830" rx="260" ry="24" fill="#3D3224" opacity="0.14" filter="blur(16px)"/>
  <ellipse cx="500" cy="825" rx="200" ry="12" fill="#2C2014" opacity="0.2" filter="blur(6px)"/>

  <!-- STRAPS -->
  <path d="M380,380 C380,140 430,120 500,120 C570,120 620,140 620,380" fill="none" stroke="url(#strapGrad)" stroke-width="32" stroke-linecap="round" filter="url(#studioShadow)"/>
  <path d="M380,380 C380,140 430,120 500,120 C570,120 620,140 620,380" fill="none" stroke="#C8BFAB" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- TOTE BODY -->
  <g filter="url(#studioShadow)">
    <!-- Main Body Shape -->
    <path d="M310,360 L690,360 C702,360 710,370 706,382 L665,800 C662,816 648,828 632,828 L368,828 C352,828 338,816 335,800 L294,382 C290,370 298,360 310,360 Z" fill="url(#toteFabric)"/>

    <!-- Top Hem Fold & Stitches -->
    <path d="M309,360 L691,360 L688,405 L312,405 Z" fill="#E2DAC7" opacity="0.5"/>
    <line x1="311" y1="405" x2="689" y2="405" stroke="#BFB69E" stroke-width="2.5" stroke-dasharray="6,5"/>
    <line x1="313" y1="410" x2="687" y2="410" stroke="#BFB69E" stroke-width="2.5" stroke-dasharray="6,5"/>

    <!-- Soft Fabric Creases -->
    <path d="M340,410 Q400,600 375,800" fill="none" stroke="#D5CCB6" stroke-width="2" opacity="0.6"/>
    <path d="M660,410 Q610,610 625,800" fill="none" stroke="#D5CCB6" stroke-width="2" opacity="0.6"/>
    <path d="M460,405 Q485,580 470,820" fill="none" stroke="#DFD6C2" stroke-width="1.5" opacity="0.5"/>

    <!-- WOVEN BRAND LABEL (Side Seam) -->
    <g transform="translate(292, 540)">
      <rect x="-24" y="0" width="28" height="48" rx="4" fill="#202020"/>
      <text x="-10" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13" fill="#F6F3ED" text-anchor="middle" transform="rotate(-90 -10 30)">gb</text>
      <ellipse cx="-2" cy="18" rx="2.2" ry="2.27" fill="#FF4D3D"/>
    </g>

    <!-- SLOGAN SERIGRAPHY PRINT (Center) -->
    <g transform="translate(500, 580)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="46" fill="#282828" letter-spacing="-1.8" text-anchor="middle">Bir yere</text>
      <text x="0" y="54" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="46" fill="#282828" letter-spacing="-1.8" text-anchor="middle">gidelim.</text>
      
      <text x="0" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#7A7263" letter-spacing="3" text-transform="uppercase" text-anchor="middle">gezenbiri · 320 g/m² ham pamuk</text>
    </g>
  </g>
</svg>